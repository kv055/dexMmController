openapi: 3.1.0
info:
  title: dexMmController public API
  version: 1.0.0
  description: Externally or browser-facing contract. This handwritten specification is the source of truth.
  contact:
    name: dexArbTrading maintainers
    url: https://github.com/kv055/dexArbTrading
servers:
  - url: http://localhost:5001
tags:
  - name: telegram-webhook
  - name: webhooks
paths:
  /api/webhooks/dex-release:
    post:
      operationId: postApiWebhooksDexRelease
      tags:
        - webhooks
      summary: POST /api/webhooks/dex-release
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: DEX release queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: POST /api/webhooks/dex-release
      security:
        - bearerWebhook: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /telegram-webhook:
    post:
      operationId: postTelegramWebhook
      tags:
        - telegram-webhook
      summary: POST /telegram-webhook
      responses:
        "200":
          description: Telegram update accepted with no response body
        default:
          description: Telegram update rejected with no response body
      description: POST /telegram-webhook
      security:
        - telegramSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
components:
  securitySchemes:
    dashboardSession:
      type: apiKey
      in: cookie
      name: dex_session
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
    bearerWebhook:
      type: http
      scheme: bearer
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Conflict:
      description: Request conflicts with the current provider or execution state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    BadGateway:
      description: Upstream exchange or wallet request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Unavailable:
      description: Required controller dependency is not ready
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    APIError:
      $ref: ../../commons/api/openapi/APIError.yaml
    TradeMode:
      type: string
      enum:
        - hedgefull_single_collateral
        - hedgeless_double_collateral
    CexPreTradeCheckRequest:
      type: object
      additionalProperties: false
      required:
        - resolved_route
      properties:
        provider:
          type: string
        fiat_currency:
          type: string
          minLength: 3
          maxLength: 3
        required_capital:
          type: number
          exclusiveMinimum: 0
        payment_method:
          type: string
        payment_methods:
          type: array
          items:
            type: string
        dex:
          type: string
        market_side:
          type: string
          enum:
            - bid
            - ask
        settlement:
          type: string
          enum:
            - onchain_direct
            - onchain_hub
            - onchain_swap
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        hedge_venue:
          type: string
        required_btc_liquidity:
          type: number
          minimum: 0
          description: >
            Position BTC plus security deposit. Required for hedgeless on-chain liquidity-pool checks and for
            Swap_main2lightning Lightning liquidity.
        routing_fee_allowance_sat:
          type: integer
          minimum: 0
        resolved_route:
          $ref: "#/components/schemas/ResolvedRoute"
    PreTradeCheckResult:
      type: object
      additionalProperties: false
      required:
        - name
        - label
        - passed
      properties:
        name:
          type: string
        label:
          type: string
        passed:
          type: boolean
        message:
          type: string
    PreTradeCheckReport:
      type: object
      additionalProperties: false
      required:
        - ok
        - checks
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/PreTradeCheckResult"
        lnd_withdraw_address:
          type: string
        resolved_payment_method:
          type: string
        lsp_healthy:
          type: boolean
        usable_inbound_sat:
          type: integer
        usable_outbound_sat:
          type: integer
        lightning_liquidity_source:
          type: string
          enum:
            - own_channels
            - lsp_channel
          description: Channel policy evaluated for this Lightning route; omitted when the route does not need Lightning.
        swap_required:
          type: boolean
        required_lightning_sat:
          type: integer
        swap_shortfall_sat:
          type: integer
        expected_lockup_sat:
          type: integer
        estimated_funding_fee_sat:
          type: integer
        quote_expires_at:
          type: string
          format: date-time
        confirmed_onchain_sat:
          type: integer
        blocking_reason:
          type: string
    ResolvedRoute:
      type: object
      additionalProperties: false
      required:
        - config_version
        - snapshot_revision
        - resolved_at
        - trade_mode
        - target_direction
        - market_side
        - provider
        - settlement
        - needs_hub
        - needs_lightning
        - fiat_currency
        - fiat_amount
        - btc_amount
        - required_capital
        - required_btc_liquidity
        - security_deposit_btc
        - routing_fee_allowance_sat
        - cex_withdrawal_fee_btc
        - swap_safety_headroom_btc
        - total_cost_btc
        - total_cost_percent
        - net_premium_percent
        - cost_inputs
      properties:
        config_version:
          type: integer
        snapshot_revision:
          type: integer
        resolved_at:
          type: string
          format: date-time
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        target_direction:
          type: string
        market_side:
          type: string
          enum:
            - bid
            - ask
        provider:
          type: string
        hedge_venue:
          type: string
        hedge_side:
          type: string
        hedge_notional_btc:
          type: number
        leverage:
          type: number
        settlement:
          type: string
          enum:
            - onchain_direct
            - onchain_hub
            - onchain_swap
        needs_hub:
          type: boolean
        needs_lightning:
          type: boolean
        fiat_currency:
          type: string
        fiat_amount:
          type: number
        btc_amount:
          type: number
        required_capital:
          type: number
        required_btc_liquidity:
          type: number
        security_deposit_btc:
          type: number
        routing_fee_allowance_sat:
          type: integer
          minimum: 0
        cex_withdrawal_fee_btc:
          type: number
          minimum: 0
        swap_safety_headroom_btc:
          type: number
          minimum: 0
        total_cost_btc:
          type: number
          minimum: 0
        total_cost_percent:
          type: number
          minimum: 0
        net_premium_percent:
          type: number
        cost_inputs:
          $ref: "#/components/schemas/RouteCostInputs"
    RouteCostInputs:
      type: object
      additionalProperties: false
      required:
        - reference_price
        - fee_tier
        - coupled_hedge
        - spot_taker_fee_btc
        - withdrawal_fee_btc
        - hedge_open_fee_btc
        - hedge_close_fee_btc
        - projected_funding_fee_btc
        - funding_cost_available
        - dex_fee_btc
        - miner_fee_btc
        - conversion_fee_btc
      properties:
        reference_price:
          type: number
          exclusiveMinimum: 0
        fee_tier:
          type: string
          enum:
            - economic
        coupled_hedge:
          type: boolean
        spot_taker_fee_btc:
          type: number
          minimum: 0
        withdrawal_fee_btc:
          type: number
          minimum: 0
        hedge_open_fee_btc:
          type: number
          minimum: 0
        hedge_close_fee_btc:
          type: number
          minimum: 0
        projected_funding_fee_btc:
          type: number
          minimum: 0
        funding_cost_available:
          type: boolean
        dex_fee_btc:
          type: number
          minimum: 0
        miner_fee_btc:
          type: number
          minimum: 0
        conversion_fee_btc:
          type: number
          minimum: 0
    CexTradeflowRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - market_side
        - btc_amount
        - fiat_currency
        - required_capital
      properties:
        provider:
          type: string
        market_side:
          type: string
          enum:
            - bid
            - ask
        btc_amount:
          type: number
          exclusiveMinimum: 0
        fiat_currency:
          type: string
          minLength: 3
          maxLength: 3
        required_capital:
          type: number
          exclusiveMinimum: 0
        required_btc_liquidity:
          type: number
          minimum: 0
        security_deposit_btc:
          type: number
          minimum: 0
        hedge_venue:
          type: string
        hedge_side:
          type: string
          enum:
            - short
            - long
        hedge_notional_btc:
          type: number
          minimum: 0
        leverage:
          type: number
          minimum: 0
        offer_id:
          type: string
        dex:
          type: string
        fiat_amount:
          type: number
          minimum: 0
        transaction_id:
          type: integer
          minimum: 1
        selected_offer:
          type: object
          additionalProperties: true
        payment_method:
          type: string
        payment_methods:
          type: array
          items:
            type: string
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        resolved_route:
          $ref: "#/components/schemas/ResolvedRoute"
        routing_fee_allowance_sat:
          type: integer
          minimum: 1
        cex_withdrawal_fee_btc:
          type: number
          minimum: 0
        swap_safety_headroom_btc:
          type: number
          minimum: 0
    CexTradeflowResult:
      type: object
      additionalProperties: false
      required:
        - trade_mode
      properties:
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        spot_buy:
          $ref: "#/components/schemas/CexSpotBuyResult"
        hedge:
          $ref: "#/components/schemas/CexHedgeOpenResult"
        withdrawal:
          $ref: "#/components/schemas/WithdrawalResult"
        dex_funding:
          $ref: "#/components/schemas/DEXFundingResult"
        pool_refill:
          $ref: "#/components/schemas/PoolRefillResult"
        transaction_id:
          type: integer
          minimum: 1
    FeeLine:
      type: object
      additionalProperties: false
      required:
        - asset
        - amount
      properties:
        asset:
          type: string
        amount:
          type: number
    ExecutionDetail:
      type: object
      additionalProperties: false
      required:
        - filled_btc
        - average_rate
        - filled_fiat
        - order_status
      properties:
        filled_btc:
          type: number
        average_rate:
          type: number
        filled_fiat:
          type: number
        fees:
          type: array
          items:
            $ref: "#/components/schemas/FeeLine"
        order_status:
          type: string
        poll_incomplete:
          type: boolean
    CexSpotBuyResult:
      type: object
      additionalProperties: false
      required:
        - provider
        - pair
        - side
        - requested_btc
        - order_id
        - status
        - submitted_at
      properties:
        provider:
          type: string
        pair:
          type: string
        side:
          type: string
        requested_btc:
          type: number
        order_id:
          type: string
        status:
          type: string
        submitted_at:
          type: string
          format: date-time
        execution:
          $ref: "#/components/schemas/ExecutionDetail"
        raw: {}
    CexHedgeOpenResult:
      type: object
      additionalProperties: false
      required:
        - venue
        - instrument
        - side
        - btc_notional
        - order_id
        - status
        - submitted_at
      properties:
        venue:
          type: string
        instrument:
          type: string
        side:
          type: string
        btc_notional:
          type: number
        order_id:
          type: string
        status:
          type: string
        submitted_at:
          type: string
          format: date-time
        raw: {}
    WithdrawalResult:
      type: object
      additionalProperties: false
      required:
        - provider
        - withdrawal_id
        - wallet_address
        - amount_btc
      properties:
        provider:
          type: string
        withdrawal_id:
          type: string
        client_request_id:
          type: string
        wallet_address:
          type: string
        amount_btc:
          type: number
        cex_status:
          type: string
    DEXFundingResult:
      type: object
      additionalProperties: false
      required:
        - exchange
        - method
        - amount_btc
        - status
      properties:
        exchange:
          type: string
        method:
          type: string
        amount_btc:
          type: number
        txid:
          type: string
        payment_hash:
          type: string
        destination:
          type: string
        status:
          type: string
    PoolRefillResult:
      type: object
      additionalProperties: false
      required:
        - target_btc
        - status
        - attempt
      properties:
        target_btc:
          type: number
        current_btc:
          type: number
        status:
          type: string
        attempt:
          type: integer
          minimum: 0
    MMTransactionStatus:
      type: object
      additionalProperties: true
      required:
        - id
        - status
      properties:
        id:
          type: integer
          minimum: 1
        status:
          type: string
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        btc_pool_target_btc:
          type: number
        btc_required_liquidity:
          type: number
        btc_pool_refill_status:
          type: string
    WithdrawalTrackResult:
      type: object
      additionalProperties: false
      required:
        - provider
        - withdrawal_id
        - cex_status
        - cex_status_code
        - updated_at
      properties:
        provider:
          type: string
        withdrawal_id:
          type: string
        cex_status:
          type: string
        cex_status_code:
          type: integer
        tx_hash:
          type: string
        address:
          type: string
        amount_btc:
          type: string
        fee_btc:
          type: number
        updated_at:
          type: string
          format: date-time
        mempool:
          $ref: "#/components/schemas/MempoolTxStatus"
    MempoolTxStatus:
      type: object
      additionalProperties: false
      required:
        - txid
        - confirmed
        - confirmations
        - status_label
      properties:
        txid:
          type: string
        confirmed:
          type: boolean
        confirmations:
          type: integer
        block_height:
          type: integer
        status_label:
          type: string
    Health:
      $ref: ../../commons/api/openapi/Health.yaml
