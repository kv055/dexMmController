components:
  securitySchemes:
    dashboardSession:
      type: apiKey
      in: cookie
      name: dex_session
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
    bearerWebhook:
      type: http
      scheme: bearer
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Conflict:
      description: Request conflicts with the current provider or execution state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    BadGateway:
      description: Upstream exchange or wallet request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Unavailable:
      description: Required controller dependency is not ready
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    APIError:
      $ref: ../../commons/api/openapi/APIError.yaml
    TradeMode:
      type: string
      enum:
        - hedgefull_single_collateral
        - hedgeless_double_collateral
    CexPreTradeCheckRequest:
      type: object
      additionalProperties: false
      required:
        - resolved_route
      properties:
        provider:
          type: string
        fiat_currency:
          type: string
          minLength: 3
          maxLength: 3
        required_capital:
          type: number
          exclusiveMinimum: 0
        payment_method:
          type: string
        payment_methods:
          type: array
          items:
            type: string
        dex:
          type: string
        market_side:
          type: string
          enum:
            - bid
            - ask
        settlement:
          type: string
          enum:
            - onchain_direct
            - onchain_hub
            - onchain_swap
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        hedge_venue:
          type: string
        required_btc_liquidity:
          type: number
          minimum: 0
          description: >
            Position BTC plus security deposit. Required for hedgeless on-chain liquidity-pool checks and for
            Swap_main2lightning Lightning liquidity.
        routing_fee_allowance_sat:
          type: integer
          minimum: 0
        resolved_route:
          $ref: "#/components/schemas/ResolvedRoute"
    PreTradeCheckResult:
      type: object
      additionalProperties: false
      required:
        - name
        - label
        - passed
      properties:
        name:
          type: string
        label:
          type: string
        passed:
          type: boolean
        message:
          type: string
    PreTradeCheckReport:
      type: object
      additionalProperties: false
      required:
        - ok
        - checks
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/PreTradeCheckResult"
        lnd_withdraw_address:
          type: string
        resolved_payment_method:
          type: string
        lsp_healthy:
          type: boolean
        usable_inbound_sat:
          type: integer
        usable_outbound_sat:
          type: integer
        lightning_liquidity_source:
          type: string
          enum:
            - own_channels
            - lsp_channel
          description: Channel policy evaluated for this Lightning route; omitted when the route does not need Lightning.
        swap_required:
          type: boolean
        required_lightning_sat:
          type: integer
        swap_shortfall_sat:
          type: integer
        expected_lockup_sat:
          type: integer
        estimated_funding_fee_sat:
          type: integer
        quote_expires_at:
          type: string
          format: date-time
        confirmed_onchain_sat:
          type: integer
        blocking_reason:
          type: string
    ResolvedRoute:
      type: object
      additionalProperties: false
      required:
        - config_version
        - snapshot_revision
        - resolved_at
        - trade_mode
        - target_direction
        - market_side
        - provider
        - settlement
        - needs_hub
        - needs_lightning
        - fiat_currency
        - fiat_amount
        - btc_amount
        - required_capital
        - required_btc_liquidity
        - security_deposit_btc
        - routing_fee_allowance_sat
        - cex_withdrawal_fee_btc
        - swap_safety_headroom_btc
        - total_cost_btc
        - total_cost_percent
        - net_premium_percent
        - cost_inputs
      properties:
        config_version:
          type: integer
        snapshot_revision:
          type: integer
        resolved_at:
          type: string
          format: date-time
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        target_direction:
          type: string
        market_side:
          type: string
          enum:
            - bid
            - ask
        provider:
          type: string
        hedge_venue:
          type: string
        hedge_side:
          type: string
        hedge_notional_btc:
          type: number
        leverage:
          type: number
        settlement:
          type: string
          enum:
            - onchain_direct
            - onchain_hub
            - onchain_swap
        needs_hub:
          type: boolean
        needs_lightning:
          type: boolean
        fiat_currency:
          type: string
        fiat_amount:
          type: number
        btc_amount:
          type: number
        required_capital:
          type: number
        required_btc_liquidity:
          type: number
        security_deposit_btc:
          type: number
        routing_fee_allowance_sat:
          type: integer
          minimum: 0
        cex_withdrawal_fee_btc:
          type: number
          minimum: 0
        swap_safety_headroom_btc:
          type: number
          minimum: 0
        total_cost_btc:
          type: number
          minimum: 0
        total_cost_percent:
          type: number
          minimum: 0
        net_premium_percent:
          type: number
        cost_inputs:
          $ref: "#/components/schemas/RouteCostInputs"
    RouteCostInputs:
      type: object
      additionalProperties: false
      required:
        - reference_price
        - fee_tier
        - coupled_hedge
        - spot_taker_fee_btc
        - withdrawal_fee_btc
        - hedge_open_fee_btc
        - hedge_close_fee_btc
        - projected_funding_fee_btc
        - funding_cost_available
        - dex_fee_btc
        - miner_fee_btc
        - conversion_fee_btc
      properties:
        reference_price:
          type: number
          exclusiveMinimum: 0
        fee_tier:
          type: string
          enum:
            - economic
        coupled_hedge:
          type: boolean
        spot_taker_fee_btc:
          type: number
          minimum: 0
        withdrawal_fee_btc:
          type: number
          minimum: 0
        hedge_open_fee_btc:
          type: number
          minimum: 0
        hedge_close_fee_btc:
          type: number
          minimum: 0
        projected_funding_fee_btc:
          type: number
          minimum: 0
        funding_cost_available:
          type: boolean
        dex_fee_btc:
          type: number
          minimum: 0
        miner_fee_btc:
          type: number
          minimum: 0
        conversion_fee_btc:
          type: number
          minimum: 0
    CexTradeflowRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - market_side
        - btc_amount
        - fiat_currency
        - required_capital
      properties:
        provider:
          type: string
        market_side:
          type: string
          enum:
            - bid
            - ask
        btc_amount:
          type: number
          exclusiveMinimum: 0
        fiat_currency:
          type: string
          minLength: 3
          maxLength: 3
        required_capital:
          type: number
          exclusiveMinimum: 0
        required_btc_liquidity:
          type: number
          minimum: 0
        security_deposit_btc:
          type: number
          minimum: 0
        hedge_venue:
          type: string
        hedge_side:
          type: string
          enum:
            - short
            - long
        hedge_notional_btc:
          type: number
          minimum: 0
        leverage:
          type: number
          minimum: 0
        offer_id:
          type: string
        dex:
          type: string
        fiat_amount:
          type: number
          minimum: 0
        transaction_id:
          type: integer
          minimum: 1
        selected_offer:
          type: object
          additionalProperties: true
        payment_method:
          type: string
        payment_methods:
          type: array
          items:
            type: string
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        resolved_route:
          $ref: "#/components/schemas/ResolvedRoute"
        routing_fee_allowance_sat:
          type: integer
          minimum: 1
        cex_withdrawal_fee_btc:
          type: number
          minimum: 0
        swap_safety_headroom_btc:
          type: number
          minimum: 0
    CexTradeflowResult:
      type: object
      additionalProperties: false
      required:
        - trade_mode
      properties:
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        spot_buy:
